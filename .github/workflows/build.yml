name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag = v + appVersion)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum

      # The release tag. The launcher's self-update compares it with appVersion, so they must match.
      # Releases come from a v* tag push, or from "Run workflow" with "Publish a release" ticked.
      - name: Release tag
        id: tag
        run: |
          v=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' launcher/app.go)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "tag ${GITHUB_REF_NAME} but appVersion is $v"; exit 1; fi
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "true" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then echo "releases only come from main"; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              echo "v$v is already released. Bump appVersion in launcher/app.go first."; exit 1
            fi
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        working-directory: launcher
        run: go test ./...

      - name: Build KnoxLauncher.exe
        working-directory: launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-H=windowsgui -buildid=" -o ../dist/KnoxLauncher.exe .

      - name: SHA256
        working-directory: dist
        run: |
          sha256sum KnoxLauncher.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "### SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: KnoxLauncher
          path: dist/

      # Only runs if a VT_API_KEY secret is set in the repo settings.
      - name: VirusTotal scan
        id: vt
        if: steps.tag.outputs.tag != '' && env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/KnoxLauncher.exe

      - name: Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Knox Launcher ${{ steps.tag.outputs.tag }}
          files: |
            dist/KnoxLauncher.exe
            dist/SHA256SUMS.txt
          body: |
            Built by GitHub Actions from commit ${{ github.sha }}. [Build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            SHA256 is in `SHA256SUMS.txt`. Paste it into https://www.virustotal.com to see the scan.
            ${{ steps.vt.outputs.analysis && format('VirusTotal: {0}', steps.vt.outputs.analysis) || '' }}
